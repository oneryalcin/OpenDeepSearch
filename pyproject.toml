[project]
name = "OpenDeepSearch"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Salaheddin Alzu'bi", email = "salaheddinalzubi@gmail.com"},
]

dependencies = [
    "openai>=1.66.2",
    "datasets>=3.3.2",
    "transformers>=4.49.0",
    "litellm>=1.61.20",
    "langchain>=0.3.19",
    "crawl4ai @ git+https://github.com/salzubi401/crawl4ai.git@main",
    "fasttext-wheel>=0.9.2",
    "wikipedia-api>=0.8.1",
    "pillow>=10.4.0",
    "smolagents>=1.9.2",
    "gradio==5.20.1",
    "loguru (>=0.7.3,<0.8.0)",
    "nest-asyncio (>=1.6.0,<2.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "dspy>=2.6.24",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
# Base optional dependencies
serpapi = ["google-search-results"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.0.1"]
docs = ["sphinx>=6.0.0", "sphinx-rtd-theme>=1.2.0"]

# Google AI-related dependencies
google = [
    "google-api-python-client>=2.100.0",
    "google-cloud-aiplatform>=1.42.0",
    "google-cloud-discoveryengine>=0.12.0",
    "google-genai>=0.2.0",
    "vertexai>=0.1.0"
]

# Local reranking fallback
local-rerank = ["rerankers[flashrank]>=0.1.0"]

# Combine all dependencies
all = [
    "google-search-results", 
    "pytest>=7.0.0", 
    "black>=23.0.0", 
    "ruff>=0.0.1",
    "sphinx>=6.0.0", 
    "sphinx-rtd-theme>=1.2.0",
    "google-api-python-client>=2.100.0",
    "google-cloud-aiplatform>=1.42.0",
    "google-cloud-discoveryengine>=0.12.0",
    "google-genai>=0.2.0",
    "rerankers[flashrank]>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pdm]
distribution = true

[tool.hatch.metadata]
allow-direct-references = true

